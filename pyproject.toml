[project]
name = "chat2local-plus"
version = "0.3.0.post1"
description = "A lightweight local agent that lets ChatGPT securely operate local files and processes through MCP."
readme = "README.md"
authors = [
    { name = "mmc-cloud" },
    { name = "renji1hao8" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "chatgpt", "local-agent", "automation", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.15.1,<3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=15.0,<18",
]

[project.scripts]
c2l-plus = "chat2local.main:main"
chat2local-plus = "chat2local.main:main"

[project.urls]
Homepage = "https://github.com/renji1hao8/Chat2Local"
Repository = "https://github.com/renji1hao8/Chat2Local"
Issues = "https://github.com/renji1hao8/Chat2Local/issues"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

# uv_build includes package data under src/chat2local automatically, including
# management/static (the compiled shared React UI). No frontend build at install time.

[tool.uv.build-backend]
module-name = "chat2local"
module-root = "src"
source-include = ["docs/*.md", "tests/*.py", "tests/*.m", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pillow>=12.3.0",
]
pywebview-gui = [
    "pillow>=12.3.0",
    "pystray==0.19.5",
    "pywebview>=6.2.1",
    "python-socks[asyncio]>=3.1.1,<4",
]
desktop-build = [
    "packaging>=24",
    "pyinstaller>=6.22,<7",
]
