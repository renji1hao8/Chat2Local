name: Plus compatibility tests
on:
  push:
    branches: ['plus/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run python -m unittest discover -s tests -p test_regressions.py -v
      - run: uv run python -m pytest -q tests/test_file_preview.py
      - run: uv run python tests/smoke_service.py
      - run: uv run python tests/mcp_e2e.py
      - run: uv run python tests/devices_e2e.py
      - run: uv run python tests/resilience_e2e.py
